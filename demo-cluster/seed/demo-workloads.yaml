# Seed workloads for the KubeVoice demo.
# Creates three namespaces with healthy apps plus two deliberately broken
# workloads so the voice agent has something interesting to report.
#
# Apply with: kubectl apply -f demo-cluster/seed/demo-workloads.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: payments
---
apiVersion: v1
kind: Namespace
metadata:
  name: orders
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
# Healthy: payments API (2 replicas of nginx standing in for a service)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments
  labels: { app: payments-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: payments-api }
  template:
    metadata:
      labels: { app: payments-api }
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
---
# BROKEN #1: bad image tag -> ImagePullBackOff (agent should find this)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-worker
  namespace: payments
  labels: { app: payments-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: payments-worker }
  template:
    metadata:
      labels: { app: payments-worker }
    spec:
      containers:
        - name: worker
          image: nginx:this-tag-does-not-exist
---
# Healthy: orders API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: orders
  labels: { app: orders-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: orders-api }
  template:
    metadata:
      labels: { app: orders-api }
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
---
# BROKEN #2: container exits immediately -> CrashLoopBackOff
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-batch
  namespace: orders
  labels: { app: orders-batch }
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders-batch }
  template:
    metadata:
      labels: { app: orders-batch }
    spec:
      containers:
        - name: batch
          image: busybox:1.36
          command: ["sh", "-c", "echo 'simulating a failing batch job'; exit 1"]
---
# Healthy: a metrics stand-in so the monitoring namespace isn't empty
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-collector
  namespace: monitoring
  labels: { app: metrics-collector }
spec:
  replicas: 1
  selector:
    matchLabels: { app: metrics-collector }
  template:
    metadata:
      labels: { app: metrics-collector }
    spec:
      containers:
        - name: collector
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo collecting; sleep 60; done"]
