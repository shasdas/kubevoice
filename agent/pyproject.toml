[project]
name = "explore-livekit"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "kubernetes>=36.0.3",
    "livekit-agents[silero,turn-detector]~=1.4",
    "prometheus-client>=0.25.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
